name: Feature request
description: Suggest a new scene type, option, use case, platform preset or engine feature.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a new narrative format (a new F-number in the formats library), use the **Format proposal** template instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (scene type, option, CLI flag)
        - Aspect ratios / shorts / platforms
        - Voice or captions
        - A use-case skill (launch, jobhunt, hackathon, shorts)
        - A new use-case skill
        - Token extraction for a UI framework
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to make, and what stops you today? A concrete example helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. For an engine feature, a sketch of the config you'd write is ideal.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
  - type: checkboxes
    id: assets
    attributes:
      label: Assets
      description: Any asset this needs (art, fonts, sound) must be CC0, MIT, Apache-2.0 or OFL.
      options:
        - label: This needs no new assets, or every asset it needs is under one of those licenses.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
