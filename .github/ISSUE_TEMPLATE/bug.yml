name: Bug report
description: Something in the engine, a skill or a command doesn't work as documented.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **don't paste API keys, `.env` contents or private project details**.
        Security problems go through [private reporting](https://github.com/Dileep2896/trailer/security/advisories/new), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine CLI (node engine/trailer.mjs)
        - Render output (layout, captions, timing, sound)
        - Voice (Deepgram, say, espeak-ng, own recordings)
        - Install / doctor / first run
        - Skill or command in Claude Code
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s), and the smallest config that shows the problem (trim it, and replace real names with made-up ones).
      placeholder: |
        1. node engine/trailer.mjs examples/driftcheck --cut short --stills scenes --voice-engine none
        2. Open .trailer/review/9x16-short/scene-02-diff.png
        3. The caption overlaps the table
      render: markdown
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: --json summary or error output
      description: Re-run with `--json` and paste the summary, or the last 30 lines of the error. Paths in it are relative to the project.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Paste the output of `node engine/trailer.mjs doctor` (or `/trailer:doctor`). It reports only whether a Deepgram key is set, never the key.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: trailer version
      description: "`node engine/trailer.mjs --version`, or the plugin version in `/plugin`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node and Claude Code versions
      placeholder: "macOS 15.4, Node 22.11, Claude Code 2.1.x"
  - type: textarea
    id: media
    attributes:
      label: Stills or screenshots
      description: For visual bugs, attach the relevant still from `.trailer/review/` (a `--safe-overlay` still helps).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed keys, private names and personal data from everything above.
          required: true
